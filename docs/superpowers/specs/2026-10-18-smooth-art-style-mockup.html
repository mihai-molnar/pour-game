<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smooth Style Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0e0c12; --ink:#efe9f4; --dim:#9d94ab; --gold:#feae34; --line:rgba(255,255,255,.08); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); }
  body { font-family:Fredoka, ui-rounded, system-ui, sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:22px 16px 48px; }
  h1 { font-size:22px; font-weight:600; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:15px; margin:0 0 16px; line-height:1.4; }
  .stage { position:relative; width:100%; aspect-ratio:16/9; border-radius:14px; overflow:hidden; background:#1b1219; container-type:inline-size; box-shadow:0 12px 44px rgba(0,0,0,.55), 0 0 0 1px var(--line); }
  .stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #bg { transform:scale(1.04); }
  .hud { position:absolute; inset:0; pointer-events:none; font-size:1cqw; }
  .pill { position:absolute; display:flex; align-items:center; gap:.45em; padding:.28em .85em .28em .45em; border-radius:999px; background:rgba(16,10,18,.55); color:#fff; font-weight:600; font-size:2.3em; line-height:1.15; box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 .1em .4em rgba(0,0,0,.3); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .coins { left:2%; top:3.6%; }
  .coin { width:.95em; height:.95em; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff1b8 0, #ffd060 22%, #feae34 50%, #c0650f 100%); box-shadow:inset 0 -.07em 0 rgba(0,0,0,.25); }
  .mult { display:inline-block; color:var(--gold); margin-left:.25em; padding-left:.55em; border-left:1px solid rgba(255,255,255,.15); }
  .mult.dim { color:rgba(255,255,255,.45); }
  .mult.bump { animation:bump .5s ease-out; }
  @keyframes bump { 0% { transform:scale(1.7); } 100% { transform:scale(1); } }
  .timer { left:50%; top:3.6%; transform:translateX(-50%); padding:.28em .85em; font-variant-numeric:tabular-nums; }
  .hint { left:2%; bottom:3.4%; padding:.3em .9em; font-size:1.35em; font-weight:500; color:rgba(255,255,255,.62); background:rgba(16,10,18,.38); white-space:nowrap; }
  .hint b { color:#fff; font-weight:600; }
  .pop { position:absolute; transform:translate(-50%,-50%); text-align:center; font-weight:700; font-size:4.4em; line-height:1; color:var(--gold); text-shadow:0 .06em 0 rgba(60,20,0,.55), 0 0 .45em rgba(254,174,52,.35); animation:pop 1.4s cubic-bezier(.2,.8,.3,1) forwards; white-space:nowrap; }
  .pop small { display:block; margin-top:.18em; font-size:.34em; letter-spacing:.14em; color:#fff; text-shadow:0 .1em .2em rgba(0,0,0,.5); }
  .pop.good { color:#7ee06a; text-shadow:0 .06em 0 rgba(10,50,10,.55), 0 0 .45em rgba(99,199,77,.3); }
  .pop.ok { color:#cfe0f5; text-shadow:0 .06em 0 rgba(10,20,50,.55); }
  .pop.miss { color:#ff6b6b; text-shadow:0 .06em 0 rgba(60,0,0,.55); }
  @keyframes pop { 0% { opacity:0; transform:translate(-50%,-20%) scale(.5); } 14% { opacity:1; transform:translate(-50%,-50%) scale(1.12); } 26% { transform:translate(-50%,-52%) scale(1); } 75% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-110%) scale(1); } }
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; margin:14px 0 26px; }
  .seg { display:inline-flex; background:#1c1722; border-radius:999px; padding:3px; box-shadow:0 0 0 1px var(--line); }
  .seg button { font:inherit; font-weight:600; font-size:15px; color:var(--dim); background:none; border:0; border-radius:999px; padding:7px 18px; cursor:pointer; }
  .seg button.on { background:#efe9f4; color:#1a1420; }
  .note { color:var(--dim); font-size:14px; }
  .compare { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; align-items:start; }
  .compare img { width:100%; image-rendering:pixelated; border-radius:10px; box-shadow:0 0 0 1px var(--line); display:block; }
  .label { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin-bottom:8px; }
  .compare ul { margin:0; padding-left:18px; color:#cfc7da; line-height:1.55; font-size:15px; }
  @media (max-width:720px) { .compare { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Smooth style, rough mockup</h1>
  <!-- Design reference for docs/superpowers/specs/2026-10-18-smooth-art-style-design.md. Approved direction; the user then asked for a less blurry background, a real bar setting and see-through (refracting) liquid. -->
  <p class="sub">The game's real glass and pourer shapes with a simplified pour, drawn smooth and about twice as close. It plays itself; switch drinks below.</p>
  <div class="stage" id="stage">
    <canvas id="bg"></canvas>
    <canvas id="fg"></canvas>
    <div class="hud" id="hud">
      <div class="pill coins"><span class="coin"></span><span id="coins">0</span><span class="mult dim" id="mult">x1</span></div>
      <div class="pill timer" id="timer">0:30</div>
      <div class="pill hint"><b>Hold &darr;</b> pour &nbsp;&middot;&nbsp; <b>Space</b> serve</div>
    </div>
  </div>
  <div class="controls">
    <div class="seg" id="seg"><button data-d="water" class="on">Water</button><button data-d="wine">Wine</button></div>
    <span class="note">The background is blurred on purpose, so the glass and pourer stand out.</span>
  </div>
</div>
<script>
/*SIM*/
const DEG = Math.PI / 180, DT = 1 / 60, GRAV = 520, COUNTER_Y = 280, GLASS_HOME = [256, 280];

const DRINKS = {
  water: {
    id: 'water', kind: 'pitcher', coins: [10, 6, 3],
    glassI: [[-15, -5], [15, -5], [19, -74], [-19, -74]],
    glassO: [[-17, 0], [17, 0], [21, -74], [-21, -74]],
    fill: 0.9,
    pI: [[0, 0], [70, 0], [70, 100], [13, 100], [13, 13]],
    pO: [[-3, -1], [72, -1], [72, 105], [11, 105], [11, 15]],
    offset: [14, -105], rest: 0, maxTilt: 120, spout: [-1, -0.25],
    tiltFast: 45, tiltPour: 11.5, maxFlow: 1100, speed0: 10, speedK: 3, speedMax: 70,
    fullFrac: 0.9, refillBelow: 0.7, release: 0.965,
    col: {
      top: 'rgba(150,236,250,0.55)', mid: 'rgba(56,178,232,0.60)', deep: 'rgba(26,96,176,0.78)',
      edge: 'rgba(10,40,100,0.30)', surf: 'rgba(230,255,255,0.95)', sheen: 'rgba(180,250,255,0.30)',
      stream: '#3cc4ee', core: '#c4f6ff', drop: 'rgba(120,225,250,0.9)'
    }
  },
  wine: {
    id: 'wine', kind: 'bottle', coins: [15, 9, 5],
    glassI: [[-14, -26], [14, -26], [19, -28], [22, -32], [23, -40], [24, -52], [24, -62], [23, -72], [21, -84], [18, -96], [-18, -96], [-21, -84], [-23, -72], [-24, -62], [-24, -52], [-23, -40], [-22, -32], [-19, -28]],
    glassO: [[-14, 0], [14, 0], [14, -2], [2, -4], [2, -22], [16, -24], [21, -26], [24, -30], [25, -40], [26, -52], [26, -62], [25, -72], [23, -84], [20, -96], [-20, -96], [-23, -84], [-25, -72], [-26, -62], [-26, -52], [-25, -40], [-24, -30], [-21, -26], [-16, -24], [-2, -22], [-2, -4], [-14, -2]],
    fill: 0.53,
    pI: [[0, 0], [6, 0], [6, 24], [23, 38], [23, 148], [-17, 148], [-17, 38], [0, 24]],
    pO: [[-2, -1], [8, -1], [8, 23], [25, 37], [25, 151], [-19, 151], [-19, 37], [-2, 23]],
    offset: [12, -116], rest: 55, maxTilt: 100, spout: [0, -1],
    tiltFast: 40, tiltPour: 5, maxFlow: 1000, speed0: 8, speedK: 2.5, speedMax: 50,
    fullFrac: 0.93, refillBelow: 0.75, release: 0.975,
    col: {
      top: 'rgba(214,52,72,0.93)', mid: 'rgba(150,26,44,0.96)', deep: 'rgba(66,8,22,0.98)',
      edge: 'rgba(255,110,130,0.22)', surf: 'rgba(255,175,185,0.9)', sheen: 'rgba(255,120,140,0.25)',
      stream: '#b01f36', core: '#f0717f', drop: 'rgba(190,40,60,0.95)'
    }
  }
};

function xpt(q, o, a) { const c = Math.cos(a), s = Math.sin(a); return [o[0] + q[0] * c + q[1] * s, o[1] - q[0] * s + q[1] * c]; }
function xform(P, o, a) { return P.map(q => xpt(q, o, a)); }
function area(P) { let s = 0; for (let i = 0; i < P.length; i++) { const A = P[i], B = P[(i + 1) % P.length]; s += A[0] * B[1] - B[0] * A[1]; } return Math.abs(s) / 2; }
function bbox(P) { let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity; for (const q of P) { x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); } return { x0, y0, x1, y1 }; }
// The part of polygon P at or below the horizontal line y = h (y grows downward).
function clipBelow(P, h) {
  const out = [];
  for (let i = 0; i < P.length; i++) {
    const A = P[i], B = P[(i + 1) % P.length], ain = A[1] >= h, bin = B[1] >= h;
    if (ain) out.push(A);
    if (ain !== bin) { const t = (h - A[1]) / (B[1] - A[1]); out.push([A[0] + t * (B[0] - A[0]), h]); }
  }
  return out;
}
// Surface height for volume V (px²) in polygon P.
function levelFor(P, V) {
  const b = bbox(P); let top = b.y0, bot = b.y1;
  for (let i = 0; i < 34; i++) { const m = (top + bot) / 2; if (area(clipBelow(P, m)) > V) top = m; else bot = m; }
  return (top + bot) / 2;
}
function spanAt(P, y) {
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < P.length; i++) {
    const A = P[i], B = P[(i + 1) % P.length];
    if (A[1] === B[1] || (A[1] - y) * (B[1] - y) > 0) continue;
    const x = A[0] + (y - A[1]) / (B[1] - A[1]) * (B[0] - A[0]); lo = Math.min(lo, x); hi = Math.max(hi, x);
  }
  return [lo, hi];
}

for (const k in DRINKS) {
  const d = DRINKS[k];
  d.glassArea = area(d.glassI); d.target = d.fill * d.glassArea;
  d.lineLocal = levelFor(d.glassI, d.target);
  d.full = Math.min(d.fullFrac * area(d.pI), 0.97 * area(clipBelow(xform(d.pI, [0, 0], d.rest * DEG), 0)));
}

const S = { cur: 'water', jit: 1, t: 0, tick: 0, phase: 'arrive', phaseT: 0, quietT: 0, coins: 0, streak: 0, glasses: 0,
  glass: null, p: null, parcels: [], bubbles: [], drops: [], puffs: [], onEvent: () => {} };

function setPhase(ph) { S.phase = ph; S.phaseT = 0; S.quietT = 0; }
function freshGlass() { return { vol: 0, dx: -170, from: -170, sc: 1, alpha: 1, amp: 0, level: 0 }; }
function glassX() { return GLASS_HOME[0] + S.glass.dx; }
function lipPos() { const d = DRINKS[S.cur]; return [GLASS_HOME[0] + d.offset[0] + S.p.dx, GLASS_HOME[1] + d.offset[1]]; }
function glassWorld() { const gx = glassX(); return DRINKS[S.cur].glassI.map(q => [q[0] + gx, q[1] + COUNTER_Y]); }
function waveAt(xl) { return S.glass.amp * (0.6 * Math.sin(xl * 0.45 + S.t * 8) + 0.4 * Math.sin(xl * 0.95 - S.t * 11.5)); }
function mult(st) { return st < 2 ? 1 : Math.min(3, 1 + 0.1 * st); }
function easeOutBack(u) { const c1 = 1.3, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); }

function startDrink(id) {
  const d = DRINKS[id]; S.cur = id; S.parcels = []; S.bubbles = []; S.drops = [];
  S.glass = freshGlass();
  S.p = { vol: d.full, tilt: 0, vel: 0, dx: 300, from: 300, excess: 0, pouring: false, refillFrom: null };
  setPhase('arrive');
  S.glass.level = levelFor(glassWorld(), 0);
}

function newGlass() {
  const d = DRINKS[S.cur]; S.glass = freshGlass(); S.bubbles = []; S.glasses++;
  S.jit = 1 + (Math.random() - 0.5) * 0.09;
  if (S.p.vol < d.refillBelow * d.full) S.p.refillFrom = S.p.vol;
  setPhase('arrive');
}

function serve() {
  const d = DRINKS[S.cur], g = S.glass;
  const rows = Math.abs(Math.round(g.level) - Math.round(COUNTER_Y + d.lineLocal));
  const over = g.vol > d.glassArea - 0.5;
  const band = over ? 'SPILL' : rows <= 1 ? 'PERFECT' : rows <= 3 ? 'GOOD' : rows <= 6 ? 'GOOD ENOUGH' : 'MISS';
  const before = mult(S.streak);
  const coins = Math.round(({ 'PERFECT': d.coins[0], 'GOOD': d.coins[1], 'GOOD ENOUGH': d.coins[2] }[band] || 0) * before);
  S.coins += coins;
  if (band === 'PERFECT' || band === 'GOOD') S.streak++; else if (band === 'MISS' || band === 'SPILL') S.streak = 0;
  d.release = Math.max(0.4, Math.min(1.05, d.release * Math.pow(d.target / Math.max(g.vol, 1), 0.9)));
  const gx = glassX(), ob = bbox(d.glassO);
  for (let i = 0; i < 10; i++) S.puffs.push({ x: gx + (Math.random() - 0.5) * (ob.x1 - ob.x0), y: COUNTER_Y + ob.y0 * (0.2 + Math.random() * 0.7), r: 2 + Math.random() * 3, life: 0.45, max: 0.45 });
  S.onEvent('serve', { band, coins, rows, x: gx, top: COUNTER_Y + ob.y0 });
  setPhase('serve');
}

function land(q, gx) {
  const g = S.glass; g.vol += q.vol; g.amp = Math.min(0.8, g.amp + q.vol * 0.0028);
  const xl = q.x - gx, yl = g.level - COUNTER_Y;
  if (S.bubbles.length < 40 && Math.random() < (DRINKS[S.cur].id === 'wine' ? 0.06 : 0.35)) S.bubbles.push({ x: xl + (Math.random() - 0.5) * 3, y: yl + 2 + Math.random() * 7, r: 0.4 + Math.random() * 0.7, vy: -(10 + Math.random() * 14), ph: Math.random() * 6 });
  if (S.drops.length < 30 && Math.random() < 0.3) S.drops.push({ x: q.x, y: g.level - 0.5, vx: (Math.random() - 0.5) * 45, vy: -(35 + Math.random() * 45), r: 0.45 + Math.random() * 0.5 });
}

function step() {
  const d = DRINKS[S.cur], p = S.p, dt = DT;
  S.t += dt; S.tick++; S.phaseT += dt;

  if (S.phase === 'arrive') {
    const g = S.glass, u = Math.min(1, S.phaseT / 0.5), e = easeOutBack(u);
    g.dx = g.from * (1 - e); p.dx = p.from * (1 - e);
    if (p.refillFrom !== null) p.vol = p.refillFrom + (d.full - p.refillFrom) * u;
    if (u >= 1) { g.dx = 0; p.dx = 0; g.from = 0; p.from = 0; p.refillFrom = null; g.amp += 0.25; setPhase('wait'); }
  } else if (S.phase === 'wait') {
    if (S.phaseT > 0.35) setPhase('pour');
  } else if (S.phase === 'pour') {
    let inAir = 0; for (const q of S.parcels) inAir += q.vol;
    if (S.glass.vol + inAir >= d.release * S.jit * d.target || p.tilt >= d.maxTilt) setPhase('release');
  } else if (S.phase === 'release') {
    const quiet = p.tilt < 0.3 && Math.abs(p.vel) < 3 && S.parcels.length === 0 && p.excess <= 0;
    S.quietT = quiet ? S.quietT + dt : 0;
    if (S.quietT > 0.5) serve();
  } else if (S.phase === 'serve') {
    const g = S.glass, u = Math.min(1, S.phaseT / 0.28); g.sc = 1 - 0.3 * u; g.alpha = 1 - u;
    if (u >= 1) newGlass();
  }

  // Pourer: tilt toward the lip fast, then carefully; on release swing back with a little bounce.
  const lip = lipPos();
  if (S.phase === 'pour') {
    const sp = p.excess > -60 ? d.tiltPour : d.tiltFast; p.vel = sp; p.tilt = Math.min(d.maxTilt, p.tilt + sp * dt);
  } else {
    p.vel -= 240 * dt; p.vel *= Math.exp(-3 * dt); p.tilt += p.vel * dt;
    if (p.tilt < 0) { p.tilt = 0; p.vel = p.vel < -8 ? -p.vel * 0.25 : 0; }
  }
  const a = (d.rest + p.tilt) * DEG;
  p.excess = p.vol - area(clipBelow(xform(d.pI, lip, a), lip[1]));
  p.pouring = false;
  if (p.excess > 0.01 && S.phase !== 'arrive') {
    const out = Math.min(p.excess, Math.min(d.maxFlow, 10 * p.excess) * dt);
    p.vol -= out; p.pouring = true;
    const n = Math.hypot(d.spout[0], d.spout[1]), sx = d.spout[0] / n, sy = d.spout[1] / n, c = Math.cos(a), s = Math.sin(a);
    const sp = Math.min(d.speedMax, d.speed0 + d.speedK * Math.sqrt(p.excess));
    S.parcels.push({ x: lip[0], y: lip[1], vx: (sx * c + sy * s) * sp, vy: (-sx * s + sy * c) * sp, vol: out, tick: S.tick, inside: false, out: false });
  }

  // Stream parcels: through the opening into the glass, or past it onto the counter.
  const g = S.glass, GI = glassWorld(), gx = glassX(), gb = bbox(GI), open = spanAt(GI, gb.y0 + 0.01);
  for (const q of S.parcels) {
    const py = q.y; q.vy += GRAV * dt; q.x += q.vx * dt; q.y += q.vy * dt;
    if (!q.inside && !q.out && py < gb.y0 && q.y >= gb.y0) { if (q.x > open[0] + 0.4 && q.x < open[1] - 0.4) q.inside = true; else q.out = true; }
    if (q.inside) {
      const sp = spanAt(GI, Math.min(q.y, gb.y1 - 0.01)); q.x = Math.max(sp[0] + 0.5, Math.min(sp[1] - 0.5, q.x));
      if (q.y >= g.level + waveAt(q.x - gx)) { land(q, gx); q.dead = true; }
    } else if (q.y >= COUNTER_Y) q.dead = true;
  }
  S.parcels = S.parcels.filter(q => !q.dead);
  g.level = levelFor(GI, g.vol);
  g.amp *= Math.exp(-2.4 * dt);

  const I = d.glassI, surfL = g.level - COUNTER_Y;
  for (const b of S.bubbles) {
    b.y += b.vy * dt; b.x += Math.sin(S.t * 6 + b.ph) * 0.08;
    const sp = spanAt(I, b.y); if (sp[0] < sp[1]) b.x = Math.max(sp[0] + b.r + 0.6, Math.min(sp[1] - b.r - 0.6, b.x));
    if (b.y < surfL + waveAt(b.x) + 0.8) b.dead = true;
  }
  S.bubbles = S.bubbles.filter(b => !b.dead);
  for (const o of S.drops) {
    o.vy += GRAV * dt; o.x += o.vx * dt; o.y += o.vy * dt;
    if ((o.vy > 0 && o.y > g.level && o.x > gb.x0 && o.x < gb.x1) || o.y > COUNTER_Y) o.dead = true;
  }
  S.drops = S.drops.filter(o => !o.dead);
  for (const f of S.puffs) { f.r += 16 * dt; f.y -= 6 * dt; f.life -= dt; }
  S.puffs = S.puffs.filter(f => f.life > 0);
}
/*ENDSIM*/

// ---------- drawing ----------
const W = 1280, H = 720, VIEW_H = 190, VIEW_CX = 300, VIEW_TOP = 104, SC = H / VIEW_H, VIEW_X0 = VIEW_CX - (W / SC) / 2;
const stage = document.getElementById('stage'), hudEl = document.getElementById('hud');
const bgC = document.getElementById('bg'), fgC = document.getElementById('fg');
const bctx = bgC.getContext('2d'), fctx = fgC.getContext('2d');
let K = 1;

function worldT(c) { const s = K * SC; c.setTransform(s, 0, 0, s, -VIEW_X0 * s, -VIEW_TOP * s); }
function poly(c, P) { c.moveTo(P[0][0], P[0][1]); for (let i = 1; i < P.length; i++) c.lineTo(P[i][0], P[i][1]); c.closePath(); }
function rpoly(c, P, r) {
  const n = P.length, mid = (A, B) => [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2], dist = (A, B) => Math.hypot(A[0] - B[0], A[1] - B[1]);
  const m0 = mid(P[n - 1], P[0]); c.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++) {
    const prev = P[(i - 1 + n) % n], cur = P[i], next = P[(i + 1) % n], m = mid(cur, next);
    c.arcTo(cur[0], cur[1], m[0], m[1], Math.min(r, dist(prev, cur) / 2, dist(cur, next) / 2));
  }
  c.closePath();
}
function glow(c, x, y, r, rgb, al) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${al})`); g.addColorStop(1, `rgba(${rgb},0)`);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
}
function rng(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }

function drawBg() {

function drawStream(c) {
  const d = DRINKS[S.cur], col = d.col, ps = S.parcels;
  if (!ps.length) return;
  const runs = []; let run = [];
  for (let i = ps.length - 1; i >= 0; i--) {
    const q = ps[i]; if (run.length && run[run.length - 1].tick - q.tick > 1) { runs.push(run); run = []; } run.push(q);
  }
  if (run.length) runs.push(run);
  const lip = lipPos(), attach = S.p.pouring && runs[0][0].tick >= S.tick - 1;
  const width = q => Math.max(0.45, Math.min(3.4, 0.95 * Math.sqrt((q.vol / DT) / Math.max(30, Math.hypot(q.vx, q.vy)))));
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (const r of runs) {
    const pts = r.map(q => ({ x: q.x, y: q.y, w: width(q) }));
    if (r === runs[0] && attach) pts.unshift({ x: lip[0], y: lip[1], w: pts[0].w });
    if (pts.length < 2) { c.fillStyle = col.stream; c.beginPath(); c.arc(pts[0].x, pts[0].y, pts[0].w / 2 + 0.2, 0, 7); c.fill(); continue; }
    for (const [color, k, off] of [[col.stream, 1, 0], [col.core, 0.32, -0.3]]) {
      c.strokeStyle = color;
      for (let i = 0; i < pts.length - 1; i++) {
        const A = pts[i], B = pts[i + 1]; c.lineWidth = Math.max(0.3, (A.w + B.w) / 2 * k);
        c.beginPath(); c.moveTo(A.x + off, A.y); c.lineTo(B.x + off, B.y); c.stroke();
      }
    }
  }
}

function draw() {

  c.restore();

  drawGlass(c, false);
  drawStream(c);
  drawPourer(c, false);

}

// ---------- HUD ----------
const coinsEl = document.getElementById('coins'), multEl = document.getElementById('mult'), timerEl = document.getElementById('timer');
let shownMult = 1;
function hud() {
  coinsEl.textContent = S.coins;
  const m = mult(S.streak);
  if (m !== shownMult) {
    multEl.textContent = 'x' + (m === 1 ? '1' : m.toFixed(1)); multEl.classList.toggle('dim', m <= 1);
    if (m > shownMult) { multEl.classList.remove('bump'); void multEl.offsetWidth; multEl.classList.add('bump'); }
    shownMult = m;
  }
  timerEl.textContent = '0:' + String(Math.ceil(Math.max(0, 30 - (S.t % 34)))).padStart(2, '0');
}
S.onEvent = (type, e) => {
  if (type !== 'serve') return;
  const el = document.createElement('div');
  el.className = 'pop ' + ({ 'PERFECT': '', 'GOOD': 'good', 'GOOD ENOUGH': 'ok' }[e.band] ?? 'miss');
  el.innerHTML = (e.coins > 0 ? '+' + e.coins : '0') + '<small>' + e.band + '</small>';
  el.style.left = ((e.x - VIEW_X0) * SC / W * 100) + '%';
  el.style.top = ((e.top - 16 - VIEW_TOP) * SC / H * 100) + '%';
  hudEl.appendChild(el); setTimeout(() => el.remove(), 1500);
};

function resize() {
  const r = stage.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  for (const cv of [bgC, fgC]) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
  K = fgC.width / W;
  bgC.style.filter = `blur(${(r.width / 1280 * 7).toFixed(2)}px)`;
  drawBg();
}
new ResizeObserver(resize).observe(stage);

document.getElementById('seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  for (const x of document.querySelectorAll('#seg button')) x.classList.toggle('on', x === b);
  startDrink(b.dataset.d);
});

const qs = new URLSearchParams(location.search), qd = qs.get('d') === 'wine' ? 'wine' : 'water';
for (const x of document.querySelectorAll('#seg button')) x.classList.toggle('on', x.dataset.d === qd);
startDrink(qd); for (let i = 0, n = Math.round(parseFloat(qs.get('t') || '0') * 60); i < n; i++) step();
resize();
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= DT) { step(); acc -= DT; }
  draw(); hud(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
